    <rect x="520" y="181" width="286" height="137" rx="14" fill="#ffffff" stroke="#d4e1db"/>
    <rect x="824" y="181" width="322" height="137" rx="14" fill="#ffffff" stroke="#d4e1db"/>
  </g>

  <g font-family="Arial, sans-serif">
