    <text x="248" y="226" fill="#f06b3f" font-size="13" font-weight="700">A</text>
    <rect x="290" y="204" width="128" height="12" rx="6" fill="#174b44"/>
    <rect x="290" y="225" width="174" height="8" rx="4" fill="#d9e5df"/>
    <rect x="236" y="259" width="226" height="8" rx="4" fill="#e5ece8"/>
    <rect x="236" y="277" width="176" height="8" rx="4" fill="#e5ece8"/>
    <rect x="236" y="297" width="58" height="11" rx="5.5" fill="#e8f3ee"/>

    <rect x="540" y="201" width="40" height="40" rx="12" fill="#e7f3ef"/>
    <text x="553" y="226" fill="#1e6a5d" font-size="13" font-weight="700">S</text>
    <rect x="594" y="204" width="112" height="12" rx="6" fill="#174b44"/>
    <rect x="594" y="225" width="170" height="8" rx="4" fill="#d9e5df"/>
    <rect x="540" y="259" width="226" height="8" rx="4" fill="#e5ece8"/>
    <rect x="540" y="277" width="188" height="8" rx="4" fill="#e5ece8"/>
    <rect x="540" y="297" width="58" height="11" rx="5.5" fill="#e8f3ee"/>

    <rect x="844" y="201" width="40" height="40" rx="12" fill="#eaf4fb"/>
    <text x="856" y="226" fill="#277bb4" font-size="13" font-weight="700">M</text>
    <rect x="898" y="204" width="126" height="12" rx="6" fill="#174b44"/>
    <rect x="898" y="225" width="204" height="8" rx="4" fill="#d9e5df"/>
    <rect x="844" y="259" width="252" height="8" rx="4" fill="#e5ece8"/>
    <rect x="844" y="277" width="210" height="8" rx="4" fill="#e5ece8"/>
    <rect x="844" y="297" width="58" height="11" rx="5.5" fill="#e8f3ee"/>
  </g>

  <g opacity=".92">
    <path d="M1000 326h118" stroke="#c5d6cf" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="900" y="331" fill="#6d8279" font-family="Arial, sans-serif" font-size="10">AgentCenter 产品截图占位</text>
  </g>
</svg>
