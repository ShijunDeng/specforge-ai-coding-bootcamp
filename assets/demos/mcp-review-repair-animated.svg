<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f7f8f5"/>
  <text x="46" y="58" fill="#143d35" font-family="Noto Sans SC,Inter,Arial,sans-serif" font-size="24" font-weight="700">MCP Review and Repair Demo</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d86f45"/>
    </marker>
  </defs>
  <g font-family="Noto Sans SC,Inter,Arial,sans-serif" font-size="18">
    <rect x="52" y="108" width="180" height="96" rx="12" fill="#ffffff" stroke="#d9e2dd"/>
    <text x="82" y="145" fill="#17201b">Local branch</text>
    <text x="82" y="176" fill="#8a4b16">Seed defect</text>
    <rect x="284" y="108" width="180" height="96" rx="12" fill="#ffffff" stroke="#d9e2dd"/>
    <text x="320" y="145" fill="#17201b">MCP creates MR</text>
    <text x="320" y="176" fill="#2f6f9f">MR link</text>
    <rect x="516" y="108" width="180" height="96" rx="12" fill="#ffffff" stroke="#d9e2dd"/>
    <text x="552" y="145" fill="#17201b">Auto review</text>
    <text x="552" y="176" fill="#d86f45">Find System.out</text>
    <rect x="748" y="108" width="160" height="96" rx="12" fill="#ffffff" stroke="#d9e2dd"/>
    <text x="778" y="145" fill="#17201b">Repair Skill</text>
    <text x="778" y="176" fill="#2f8d75">Minimal diff</text>
  </g>
  <line x1="232" y1="156" x2="284" y2="156" stroke="#d86f45" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="464" y1="156" x2="516" y2="156" stroke="#d86f45" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="696" y1="156" x2="748" y2="156" stroke="#d86f45" stroke-width="4" marker-end="url(#arrow)"/>
  <circle r="10" fill="#d86f45">
    <animateMotion dur="4s" repeatCount="indefinite" path="M142 232 L374 232 L606 232 L828 232"/>
  </circle>
  <rect x="52" y="278" width="856" height="190" rx="12" fill="#101820"/>
  <text x="78" y="318" fill="#7dd3fc" font-family="Noto Sans SC,monospace" font-size="18">review-comment.json</text>
  <text x="78" y="358" fill="#fbd38d" font-family="Noto Sans SC,monospace" font-size="17">risk: sensitive or uncontrolled logging</text>
  <text x="78" y="390" fill="#f87171" font-family="Noto Sans SC,monospace" font-size="17">bad: System.out.println(ak)</text>
  <text x="78" y="422" fill="#9ae6b4" font-family="Noto Sans SC,monospace" font-size="17">fix: log.info("SMN send failed, ak=****1234")</text>
  <text x="78" y="454" fill="#9ae6b4" font-family="Noto Sans SC,monospace" font-size="17">evidence: MR link + review comment + fixed test</text>
</svg>
