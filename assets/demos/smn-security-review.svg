<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f7f8f5"/>
  <text x="44" y="58" fill="#143d35" font-family="Noto Sans SC,Inter,Arial,sans-serif" font-size="24" font-weight="700">SMN security design: config, logs, tests</text>
  <rect x="44" y="90" width="410" height="356" rx="12" fill="#0b1116"/>
  <text x="68" y="128" fill="#7dd3fc" font-family="Noto Sans SC,monospace" font-size="17">application-alert.yaml</text>
  <text x="68" y="170" fill="#e5edf2" font-family="Noto Sans SC,monospace" font-size="16">smn.region: cn-north-4</text>
  <text x="68" y="202" fill="#e5edf2" font-family="Noto Sans SC,monospace" font-size="16">smn.topic: ${SMN_TOPIC}</text>
  <text x="68" y="234" fill="#9ae6b4" font-family="Noto Sans SC,monospace" font-size="16">smn.ak: ${SMN_AK}</text>
  <text x="68" y="266" fill="#9ae6b4" font-family="Noto Sans SC,monospace" font-size="16">smn.sk: ${SMN_SK}</text>
  <text x="68" y="328" fill="#fbd38d" font-family="Noto Sans SC,monospace" font-size="16">log: ak=****1234, requestId=...</text>
  <text x="68" y="370" fill="#f87171" font-family="Noto Sans SC,monospace" font-size="16">reject: print full secret</text>
  <rect x="500" y="90" width="390" height="356" rx="12" fill="#ffffff" stroke="#d9e2dd"/>
  <text x="526" y="130" fill="#143d35" font-family="Noto Sans SC,Inter,Arial,sans-serif" font-size="20" font-weight="700">Review Checklist</text>
  <g font-family="Noto Sans SC,Inter,Arial,sans-serif" font-size="18">
    <circle cx="536" cy="178" r="10" fill="#2f8d75"/><text x="558" y="184" fill="#17201b">AK/SK injected by config only</text>
    <circle cx="536" cy="226" r="10" fill="#2f8d75"/><text x="558" y="232" fill="#17201b">Logs are masked by default</text>
    <circle cx="536" cy="274" r="10" fill="#2f8d75"/><text x="558" y="280" fill="#17201b">Validate empty and invalid region</text>
    <circle cx="536" cy="322" r="10" fill="#2f8d75"/><text x="558" y="328" fill="#17201b">Failure paths have stub tests</text>
    <circle cx="536" cy="370" r="10" fill="#d86f45"/><text x="558" y="376" fill="#17201b">No real secrets in Prompt or MR</text>
  </g>
  <rect x="44" y="466" width="846" height="36" rx="18" fill="#143d35"/>
  <text x="272" y="490" fill="#fff" font-family="Noto Sans SC,Inter,Arial,sans-serif" font-size="18">Missing any item blocks implementation.</text>
</svg>
