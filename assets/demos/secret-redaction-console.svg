<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#0f1418"/>
  <rect x="28" y="26" width="904" height="488" rx="22" fill="#142028" stroke="#31424a"/>
  <text x="60" y="74" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Secret redaction boundary</text>
  <rect x="78" y="118" width="804" height="318" rx="16" fill="#0f172a" stroke="#334155"/>
  <g font-family="ui-monospace,Menlo,monospace" font-size="17">
    <text x="110" y="166" fill="#7dd3fc">$ cat mcp.env.example</text>
    <text x="110" y="206" fill="#86efac">MCP_TOKEN=****9f2a</text>
    <text x="110" y="240" fill="#86efac">SMN_AK=****AK</text>
    <text x="110" y="274" fill="#86efac">SMN_SK=****SK</text>
    <text x="110" y="326" fill="#f87171">blocked: full token in prompt, slide, log, MR comment</text>
    <text x="110" y="366" fill="#fbbf24">allowed: masked value + config location + scope name</text>
  </g>
  <rect x="630" y="160" width="190" height="84" rx="14" fill="#3a1d1d" stroke="#f87171"/>
  <text x="725" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#fecaca">do not paste</text>
  <g data-auto-motion="subtle-runner" opacity="0.82">
    <circle r="7" fill="#f59e0b">
      <animateMotion dur="5.2s" repeatCount="indefinite" path="M80 486 H880" />
    </circle>
    <rect x="70" y="480" width="820" height="2" rx="1" fill="#334155" opacity="0.75"/>
  </g>
</svg>
