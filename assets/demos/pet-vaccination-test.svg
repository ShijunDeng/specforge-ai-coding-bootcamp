<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#101417"/>
  <rect x="26" y="24" width="908" height="492" rx="18" fill="#f7f8f5" stroke="#d9e2dd"/>
  <text x="48" y="62" fill="#143d35" font-family="Noto Sans SC,Inter,Arial,sans-serif" font-size="24" font-weight="700">Pet vaccination field: code + test run</text>
  <rect x="48" y="88" width="520" height="356" rx="10" fill="#0b1116"/>
  <text x="70" y="124" fill="#7dd3fc" font-family="Noto Sans SC,monospace" font-size="17">Pet.java</text>
  <text x="70" y="164" fill="#9ae6b4" font-family="Noto Sans SC,monospace" font-size="17">+ private String vaccinationRecord;</text>
  <text x="70" y="204" fill="#e5edf2" font-family="Noto Sans SC,monospace" font-size="17">PetController.findPets(...)</text>
  <text x="70" y="244" fill="#9ae6b4" font-family="Noto Sans SC,monospace" font-size="17">+ filter by vaccinationRecord</text>
  <text x="70" y="292" fill="#fbd38d" font-family="Noto Sans SC,monospace" font-size="17">Review: do not touch unrelated Owner page</text>
  <text x="70" y="332" fill="#9ae6b4" font-family="Noto Sans SC,monospace" font-size="17">+ PetControllerTests.findVaccinatedPets()</text>
  <rect x="596" y="88" width="292" height="356" rx="10" fill="#111827"/>
  <text x="618" y="124" fill="#7dd3fc" font-family="Noto Sans SC,monospace" font-size="17">Terminal</text>
  <text x="618" y="166" fill="#e5edf2" font-family="Noto Sans SC,monospace" font-size="16">$ mvn -Dtest=PetControllerTests test</text>
  <text x="618" y="212" fill="#f87171" font-family="Noto Sans SC,monospace" font-size="16">Round 1: cannot resolve field</text>
  <text x="618" y="252" fill="#fbd38d" font-family="Noto Sans SC,monospace" font-size="16">AI fixes mapping only</text>
  <text x="618" y="298" fill="#9ae6b4" font-family="Noto Sans SC,monospace" font-size="16">Round 2: Tests run: 9</text>
  <text x="618" y="330" fill="#9ae6b4" font-family="Noto Sans SC,monospace" font-size="16">Failures: 0</text>
  <text x="618" y="362" fill="#9ae6b4" font-family="Noto Sans SC,monospace" font-size="16">BUILD SUCCESS</text>
  <rect x="48" y="462" width="840" height="30" rx="15" fill="#2f8d75"/>
  <rect x="48" y="462" width="0" height="30" rx="15" fill="#d86f45">
    <animate attributeName="width" values="80;320;840" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="392" y="484" fill="#fff" font-family="Noto Sans SC,Inter,Arial,sans-serif" font-size="17">red -> repair -> green</text>
</svg>
