meta:
  id: ai-assisted-development-course
  title: AI 辅助开发课程
  subtitle: 从 CodeAgent 工具链到规格驱动研发
  brand:
    name: 神灯局
    vision: 点亮你的研发愿望，让AI成为团队神灯。
    logo: ./assets/brand/shendengju-logo.png
  version: v2.0.0
  updated: "2026-07-17"
  language: zh-CN
  audience_label: 企业研发工程师
  summary: >-
    AI 辅助开发培训的五页精简版本，仅保留封面、课程地图、培训目标、
    课程组织和环境准备。

audience:
  primary: 需要把 AI Agent 纳入日常功能开发、代码检视和规格驱动研发流程的工程师。
  prerequisites:
    - 熟悉 Git 分支、MR、单元测试、代码 Review 和本地构建流程。
    - 已准备 JDK、Maven、Git、样例项目及必要仓库权限。
    - CodeAgent、CodeSpec、AgentCenter、CodeHub CLI 的版本、权限与凭据按内部通知准备。
  learning_outcomes:
    - 能说明课程原有两条主线和最终产出。
    - 能确认本地环境与内部权限是否就绪。

learning_design:
  duration_min: 9
  promise: 用五页完成课程目标、课堂组织和环境准备对齐。
  principles:
    - "Evidence first: 每次生成都必须落到 Diff、测试、MR 或文档证据。"
    - "Explore before edit: 先理解现状和约束，再规划与编码。"
    - "Human review: 人负责边界、审核、授权和停止条件。"
    - "No invention: 内部工具未知细节统一标记为待内部补充。"
  visual_system:
    style: "专业、简洁的研发培训风，以流程、对比、任务卡、终端和文档流承载信息。"
    palette: "深绿承担主线，蓝色表示工具动作，橙色表示风险与反馈，紫色表示规格与设计。"
  slide_contract:
    - "附件整体课程安排表中的每一行严格对应一张 authored slide，标题保持不变。"
    - "讲解页只保留一个中心观点、3-5 个要点和一个服务于内容的视觉结构。"
    - "实战页必须在可见区呈现任务目标、步骤与验收标准。"
    - "内部工具命令、界面、版本差异、权限和加载规则未知时必须显示待内部补充。"

deck_defaults:
  theme: default
  transition: slide-left
  export_filename: ai-assisted-development-3h30
  output: build/slides/ai-assisted-development-3h30.slidev.md

decks:
  - id: first-5-pages
    title: 五页精简版
    output: build/slides/ai-assisted-development-3h30.slidev.md
    include_modules:
      - orientation

modules:
  - id: orientation
    file: specs/modules/00-orientation.md
    title: 课程引导
    duration_min: 9
    tags: [intro, required]

labs: []

assessment:
  pass_rule: 以课堂演示、文档、Diff、测试和 MR 证据是否完整作为学习完成判断。
  criteria: []
  red_lines:
    - 真实 Token、密钥、生产地址或内部敏感数据进入 Prompt、日志、MR 或课件。
    - 未经人工 Review 直接合并 Agent 生成的代码或规格。
    - 将公开产品能力未经确认写成内部工具的既有能力。
