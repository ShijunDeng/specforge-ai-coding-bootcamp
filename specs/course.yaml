meta:
  id: ai-coding-bootcamp
  title: 企业级 AI 辅助编码实战营
  subtitle: 从零散提示词到可验收的工程化研发闭环
  version: v1.0.0
  updated: "2026-06-05"
  language: zh-CN
  audience_label: 首期核心项目 Committer
  summary: >-
    面向企业内部核心项目 Committer 的 7 小时 AI 辅助编码实战课程。课程从 CodeAgent、
    AgentCenter、MCP、Skill、CodeWiki 等工具入手，训练你把 AI 生成能力纳入需求拆解、
    本地验证、MR、代码检视、自动修复和 SDD 文档驱动的工程闭环。

audience:
  primary: 核心项目 Committer、技术骨干、需要在团队内推广 AI 辅助研发方法的工程师。
  prerequisites:
    - 熟悉 Git 分支、MR、单测、代码 Review 和本地调试流程。
    - 能在本地运行 spring-petclinic，并提前准备 dolphin-scheduler 代码仓。
    - 已完成内部 AI 工具、CodeAgent 客户端、MCP Token、PKIToken 或等价授权。
  learning_outcomes:
    - 能把需求拆成 AI 可执行的小任务，并用测试、日志、MR 或文档形成证据链。
    - 能用上下文选择、提示契约和人工 Review 降低 AI 偏航概率。
    - 能用 Skill 固化高频研发动作，减少模板化劳动。
    - 能用 MCP 完成提单、检视、修复等外部系统动作，并理解权限边界。
    - 能用 CodeWiki 探查存量项目约束，再用 SDD 生成 Proposal、Spec、Design、Tasks。
    - 能在团队内复用本课程的 Spec、练习和 Rubric 做二次培训。

learning_design:
  duration_min: 420
  promise: 从“让 AI 帮我写一段代码”升级为“让 AI 在工程约束内交付可验收增量”。
  principles:
    - "Spec first: 先明确目标、边界、验收，再请求生成。"
    - "Human in the loop: 人负责判断、审查、授权和取舍。"
    - "Evidence over confidence: 不接受只会解释的答案，必须有测试、日志、MR 或设计文档证据。"
    - "Small batch: 小步提交、小步验证，降低 AI 偏航后的返工成本。"
    - "Security by default: Token、MCP 权限、AK/SK、日志输出都需要最小权限和脱敏边界。"
  classroom_pattern:
    - "讲解 25%: 给心智模型、工程原则和质量边界。"
    - "演示 25%: 展示真实输入、失败、修正和验收。"
    - "练习 40%: 独立完成，现场支持只处理阻塞。"
    - "复盘 10%: 抽样展示证据链，而不是展示最终代码截图。"

