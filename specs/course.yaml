labs: []

assessment:
  pass_rule: 以课堂演示、文档、Diff、测试和 MR 证据是否完整作为学习完成判断。
  criteria: []
  red_lines:
    - 真实 Token、密钥、生产地址或内部敏感数据进入 Prompt、日志、MR 或课件。
    - 未经人工 Review 直接合并 Agent 生成的代码或规格。
    - 将公开产品能力未经确认写成内部工具的既有能力。
