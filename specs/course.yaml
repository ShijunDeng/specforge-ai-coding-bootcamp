meta:
  id: ai-assisted-development-course
  title: AI 辅助开发课程
  subtitle: 从 CodeAgent 工具链到规格驱动研发
  brand:
    name: 神灯局
    vision: 点亮你的研发愿望，让AI成为团队神灯。
    logo: ./assets/brand/shendengju-logo.png
  version: v2.0.0
  updated: "2026-07-17"
  language: zh-CN
  audience_label: 企业研发工程师
  summary: >-
    面向企业研发工程师的 3.5 小时 AI 辅助开发实战课程。课程从 AI Coding
    工程范式、CodeAgent 使用、Skill、CLI、MCP 和 MR 反馈闭环出发，进一步进入
    SDD、业界规格工具和 CodeSpec 实战。所有内部工具的命令、界面和产品细节均以
    内部正式资料为准，未知内容保留“待内部补充”。

audience:
  primary: 需要把 AI Agent 纳入日常功能开发、代码检视和规格驱动研发流程的工程师。
  prerequisites:
    - 熟悉 Git 分支、MR、单元测试、代码 Review 和本地构建流程。
    - 已准备 JDK、Maven、Git、样例项目及必要仓库权限。
    - CodeAgent、CodeSpec、AgentCenter、CodeHub CLI 的版本、权限与凭据按内部通知准备。
  learning_outcomes:
    - 能用 Explore、Plan、Code、Verify 的节奏完成小范围功能开发。
    - 能把测试、提交、MR、检视和修复串成可停止的反馈闭环。
    - 能判断 Skill over CLI 与 MCP 的适用边界，并用 AGENTS.md 固化项目规则。
    - 能解释 SDD 的 Spec、Design、Tasks、Implementation、Verification 阶段。
    - 能在 Brownfield 项目中校准全量设计，并完成一次端到端 SDD 练习。

learning_design:
  duration_min: 210
  promise: 用半天时间跑通从 Agent 辅助编码、MR 反馈闭环到规格驱动研发的完整路径。
  principles:
    - "Evidence first: 每次生成都必须落到 Diff、测试、MR 或文档证据。"
    - "Explore before edit: 先理解现状和约束，再规划与编码。"
    - "Human review: 人负责边界、审核、授权和停止条件。"
    - "No invention: 内部工具未知细节统一标记为待内部补充。"
  visual_system:
    style: "专业、简洁的研发培训风，以流程、对比、任务卡、终端和文档流承载信息。"
    palette: "深绿承担主线，蓝色表示工具动作，橙色表示风险与反馈，紫色表示规格与设计。"
  slide_contract:
    - "附件整体课程安排表中的每一行严格对应一张 authored slide，标题保持不变。"
    - "讲解页只保留一个中心观点、3-5 个要点和一个服务于内容的视觉结构。"
    - "实战页必须在可见区呈现任务目标、步骤与验收标准。"
    - "内部工具命令、界面、版本差异、权限和加载规则未知时必须显示待内部补充。"

deck_defaults:
