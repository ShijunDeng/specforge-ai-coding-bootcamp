labs:
  - id: pet-vaccination
    title: Pet 疫苗接种字段与查询接口
    module: petclinic-micro-loop
    duration_min: 30
    objective: 用 CodeAgent 完成小范围功能开发，并调用 UT Skill 生成测试。
    constraints:
      - 禁止手敲业务代码。
      - 先让 AI 输出修改计划，再采纳代码。
      - 报错必须交给 AI 定位和修复。
    acceptance:
      - 相关接口可正常查询新增字段。
      - 新增或更新单测本地运行通过。
      - 能解释采纳前 Review 了哪些风险。

  - id: mcp-review-repair-lab
    title: MCP 建单、代码检视与自动修复
    module: mcp-review-repair
    duration_min: 35
    objective: 通过 MCP 创建 MR，触发机器检视，并使用修复 Skill 完成闭环。
    constraints:
      - 禁止手敲 Git 命令替代 MCP。
      - 禁止手动修复缺陷绕过修复 Skill。
      - 不暴露真实 Token 和内部密钥。
    acceptance:
      - 有可访问 MR 链接。
      - 有机器检视意见记录。
      - 修复 diff 与测试结果可复核。

  - id: smn-sdd-docs
    title: SMN 告警四阶 SDD 文档
    module: smn-design-lab
    duration_min: 55
    objective: 查询 CodeWiki 后生成 Proposal、Spec、Design、Tasks，并完成同伴 Review。
    constraints:
      - 禁止生成 Java 业务代码。
      - Design 必须覆盖 AK/SK 安全设计。
      - Tasks 必须细化到类、配置、测试和验收命令。
    acceptance:
      - 四份文档完整且互相一致。
      - 至少引用两类现有项目事实或规范。
      - Review 后有一次明确修订记录。

  - id: smn-homework
    title: SMN 告警真实落地大作业
    module: assessment-rollout
    duration_min: 0
    objective: 课后按照过审 Tasks 分步实现业务代码并提交 MR。
    constraints:
      - MR 描述必须链接四阶文档。
      - 每个任务完成后保留测试或检查证据。
      - 不得提交真实凭证、生产配置或敏感日志。
    acceptance:
      - MR 能通过编译和关键测试。
      - 代码符合现有插件架构和配置风格。
      - 机器检视和人工 Review 的关键意见已处理。

assessment:
  pass_rule: 总分 80 分及以上为通过；安全红线问题未修复时，即使总分达标也需返工。
  criteria:
    - name: SDD 文档质量
      weight: 30
      evidence: Proposal、Spec、Design、Tasks 完整，AK/SK、错误处理、测试策略明确。
    - name: 实现正确性
      weight: 25
      evidence: SMN 插件按现有架构接入，核心路径可运行。
    - name: 测试与验证
      weight: 20
      evidence: 本地测试、配置校验、异常路径或桩测试结果可复核。
    - name: AI 协作过程
      weight: 15
      evidence: 有提示词、打回修订、检视意见、修复记录等过程证据。
    - name: 安全与合规
      weight: 10
      evidence: 无真实密钥、无敏感日志、权限边界和脱敏处理明确。
  red_lines:
    - 真实 AK/SK、Token、生产地址或内部敏感数据进入 Prompt、日志、MR 或课件。
    - 绕过 Review 直接合并 AI 生成代码。
    - 关键测试失败但仍提交作业。
